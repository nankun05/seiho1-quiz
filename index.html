<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>生保1 合格クイズ</title>
<style>
:root{--bg:#f4f7fb;--panel:#fff;--panel2:#f8fafc;--text:#172033;--muted:#64748b;--line:#dbe3ee;--accent:#2563eb;--accent2:#1d4ed8;--good:#15803d;--bad:#b91c1c;--goodbg:#f0fdf4;--badbg:#fef2f2;--shadow:0 10px 30px rgba(15,23,42,.08)}
@media(prefers-color-scheme:dark){:root{--bg:#0b1220;--panel:#111a2b;--panel2:#162033;--text:#eef4ff;--muted:#9fb0c7;--line:#26344a;--accent:#60a5fa;--accent2:#93c5fd;--good:#4ade80;--bad:#fb7185;--goodbg:#10251a;--badbg:#2a151b;--shadow:0 10px 30px rgba(0,0,0,.22)}}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;line-height:1.65}button,input,select,textarea{font:inherit}button{cursor:pointer}
#app{display:none}.auth{min-height:100vh;display:grid;place-items:center;padding:24px}.auth-card{width:min(420px,100%);background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:28px;box-shadow:var(--shadow);text-align:center}.auth-logo{width:58px;height:58px;margin:0 auto 16px;border-radius:18px;display:grid;place-items:center;background:var(--text);color:var(--bg);font-weight:900}.auth-card input{width:100%;min-height:48px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--panel2);color:var(--text);text-align:center;font-size:20px;letter-spacing:.18em}.auth-error{min-height:24px;color:var(--bad)}
.shell{max-width:1040px;margin:0 auto;padding:18px 16px 48px}.header{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:18px;flex-wrap:wrap}.brand{display:flex;gap:12px;align-items:center}.logo{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:var(--text);color:var(--bg);font-weight:900}.brand h1{font-size:20px;margin:0}.muted{color:var(--muted)}.btn{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:12px;padding:10px 14px;font-weight:750;min-height:44px}.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}.btn.danger{color:var(--bad)}
.panel{display:none}.panel.show{display:block}.hero{background:linear-gradient(135deg,var(--panel),var(--panel2));border:1px solid var(--line);border-radius:24px;padding:24px;box-shadow:var(--shadow)}.hero h2{font-size:clamp(26px,5vw,40px);margin:0 0 8px}.hero p{margin:0;color:var(--muted)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:18px}.stat{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px}.stat b{font-size:24px;display:block}.stat span{font-size:12px;color:var(--muted)}
.section-title{display:flex;justify-content:space-between;align-items:end;margin:26px 2px 12px}.section-title h3{margin:0}.chapters{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.chapter{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px;text-align:left;color:var(--text);position:relative;min-height:136px}.chapter:hover{border-color:var(--accent);transform:translateY(-1px)}.chapter-no{font-size:12px;font-weight:850;color:var(--accent)}.chapter h4{margin:5px 0 8px;font-size:18px}.chapter p{margin:0;color:var(--muted);font-size:13px}.pill{position:absolute;right:14px;top:14px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);padding:4px 9px;font-size:11px;font-weight:800}
.quiz-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}.quiz-top h2{margin:0}.mode-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.mode-row select{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:10px;padding:9px 12px;min-height:44px}.progress-wrap{margin:14px 0}.progress-track{height:9px;background:var(--line);border-radius:999px;overflow:hidden}.progress-bar{height:100%;background:var(--accent);width:0}.progress-meta{display:flex;justify-content:space-between;gap:10px;margin-top:6px;font-size:12px;color:var(--muted)}.question-nav{display:flex;gap:7px;overflow-x:auto;padding:4px 0 12px}.question-nav button{flex:0 0 38px;height:38px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--text);font-weight:800}.question-nav button.current{outline:3px solid color-mix(in srgb,var(--accent) 22%,transparent);border-color:var(--accent)}.question-nav button.correct{background:var(--goodbg);border-color:var(--good)}.question-nav button.wrong{background:var(--badbg);border-color:var(--bad)}
.question-card,.result-card{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:clamp(18px,4vw,30px);box-shadow:var(--shadow)}.qtag{display:inline-flex;padding:5px 10px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);font-size:12px;font-weight:800}.question{font-size:clamp(17px,3vw,21px);font-weight:780;white-space:pre-line;margin:16px 0 20px}.choices{display:grid;gap:10px}.choice{display:flex;gap:12px;align-items:flex-start;border:1.5px solid var(--line);border-radius:14px;padding:14px;background:var(--panel2);cursor:pointer}.choice.selected{border-color:var(--accent)}.choice.correct{border-color:var(--good);background:var(--goodbg)}.choice.wrong{border-color:var(--bad);background:var(--badbg)}.letter{font-weight:900;min-width:22px}
.input-answer{display:grid;gap:12px;border:1.5px solid var(--line);border-radius:14px;padding:16px;background:var(--panel2)}.input-answer label{display:grid;gap:7px;font-weight:800}.input-answer input,.input-answer textarea{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:12px;color:var(--text);background:var(--panel)}.input-answer textarea{min-height:96px}.input-hint{font-size:13px;color:var(--muted);font-weight:600}
.feedback{display:none;margin-top:18px;border-radius:14px;padding:15px;background:var(--panel2);border:1px solid var(--line)}.feedback.show{display:block}.actions{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap;margin-top:20px}.right{display:flex;gap:8px;flex-wrap:wrap}.big{font-size:clamp(54px,12vw,92px);font-weight:950;text-align:center}.grade{text-align:center;font-size:20px;font-weight:850}.review{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:14px;margin:8px 0}.footer{margin-top:28px;text-align:center;color:var(--muted);font-size:12px}.footer a{color:var(--accent)}
@media(max-width:720px){.stats{grid-template-columns:repeat(2,1fr)}.chapters{grid-template-columns:1fr}}
</style>
</head>
<body>
<section id="auth" class="auth"><form id="authForm" class="auth-card"><div class="auth-logo">生1</div><h1>生保1 合格クイズ</h1><p class="muted">閲覧するにはパスワードを入力してください。</p><input id="pw" type="password" inputmode="numeric" autofocus><button class="btn primary" style="width:100%;margin-top:14px">クイズを開く</button><p id="authError" class="auth-error"></p></form></section>
<div id="app" class="shell">
<header class="header"><div class="brand"><div class="logo">生1</div><div><h1>生保1 合格クイズ</h1><small class="muted">日本アクチュアリー会テキスト × 過去問論点</small></div></div><div><button id="homeBtn" class="btn">ホーム</button> <button id="logoutBtn" class="btn">ログアウト</button> <button id="resetBtn" class="btn danger">学習記録をリセット</button></div></header>
<main id="homePanel" class="panel show"><section class="hero"><h2>生保1を、クイズで合格水準へ。</h2><p>各章50問の問題プールから、毎回10問をランダム出題。基礎・本番レベル・難問、間違い復習、お気に入りに対応。</p><div class="stats"><div class="stat"><b id="statAttempts">0</b><span>解答済み</span></div><div class="stat"><b id="statCorrect">0</b><span>累計正解</span></div><div class="stat"><b id="statRate">—</b><span>累計正答率</span></div><div class="stat"><b id="statWeak">0</b><span>復習対象</span></div></div></section><div class="section-title"><h3>章を選択</h3><span class="muted">第1章・第2章 公開中</span></div><section id="chapters" class="chapters"></section></main>
<main id="quizPanel" class="panel"><div class="quiz-top"><div><h2 id="quizTitle"></h2><p id="quizDesc" class="muted"></p></div><div class="mode-row"><label>出題：</label><select id="mode"><option value="all">全レベル</option><option value="basic">基礎</option><option value="exam">本番レベル</option><option value="hard">難問</option><option value="weak">間違えた問題だけ</option><option value="favorite">お気に入りだけ</option></select><button id="newSetBtn" class="btn">新しい10問</button></div></div><div class="progress-wrap"><div class="progress-track"><div id="progressBar" class="progress-bar"></div></div><div class="progress-meta"><span id="progressText">1 / 10</span><span id="liveScore">正解 0 / 0</span></div></div><nav id="questionNav" class="question-nav"></nav><section class="question-card"><div style="display:flex;justify-content:space-between;gap:10px"><div id="qTag" class="qtag"></div><button id="favoriteBtn" class="btn">☆ お気に入り</button></div><p id="question" class="question"></p><form id="choiceForm" class="choices"></form><div id="feedback" class="feedback"></div><div class="actions"><button id="prevBtn" class="btn">← 前へ</button><div class="right"><button id="revealBtn" class="btn">答えを見る</button><button id="checkBtn" class="btn primary">判定する</button><button id="nextBtn" class="btn primary" style="display:none">次へ →</button></div></div></section></main>
<main id="resultPanel" class="panel"><section class="result-card"><div id="finalScore" class="big">0 / 10</div><div id="grade" class="grade"></div><p id="resultMessage" class="muted" style="text-align:center"></p><div id="reviewList"></div><div class="actions"><button id="resultHomeBtn" class="btn">ホームへ</button><div class="right"><button id="weakRetryBtn" class="btn">間違いだけ復習</button><button id="retryBtn" class="btn primary">新しい10問</button></div></div></section></main>
<footer class="footer">出典：<a href="https://www.actuaries.jp/examin/textbook/" target="_blank">日本アクチュアリー会 保険1（生命保険）テキスト</a> ／ <a href="https://www.actuaries.jp/lib/collection/" target="_blank">過去問題集</a></footer>
</div>
<script>
const CHAPTERS={"1":{"title":"第1章「営業保険料」","short":"営業保険料","desc":"Equation type / Accumulation type、予定基礎率、予定事業費、十分性・公平性など。","source":"日本アクチュアリー会 生保1 第1章公式テキスト・過去問論点","bank":[{"id":"c1q1","level":"basic","type":"input","tag":"営業保険料の構成","q":"営業保険料は、保険給付の対価である（①）に、事業費等に対応する（②）を加えたものである。","fields":[{"label":"①","answers":["純保険料"]},{"label":"②","answers":["付加保険料"]}],"e":"完成文：営業保険料は、純保険料に付加保険料を加えたものです。教科書1.1。"},{"id":"c1q2","level":"basic","type":"choice","tag":"営業保険料の考慮事項","q":"営業保険料の水準を決める際の主な考慮事項について、空欄の正しい組合せを選べ。\n\n（①）、（②）、収益性、標準責任準備金制度との関係、（③）","c":["①十分性／②公平性／③価格競争力","①普遍性／②効用性／③流動性","①収益性／②安全性／③継続性","①十分性／②簡素性／③解約控除"],"a":0,"e":"完成：十分性、公平性、収益性、標準責任準備金制度との関係、価格競争力。教科書1.2。"},{"id":"c1q3","level":"basic","type":"keywords","tag":"5つの考慮事項","q":"【列挙】営業保険料の水準を決める際の主な考慮事項を5つ、すべて入力せよ。","keys":[["十分性"],["公平性"],["収益性"],["標準責任準備金制度","標準責任準備金"],["価格競争力"]],"e":"正答：十分性、公平性、収益性、標準責任準備金制度との関係、価格競争力。順不同で判定します。教科書1.2。"},{"id":"c1q4","level":"basic","type":"input","tag":"十分性","q":"営業保険料の（①）は最も重要であり、保険料が十分か不足するかによって会社の最終的な（②）が決定される。契約者からの直接の（③）という意味で営業保険料は第一義的に重要である。","fields":[{"label":"①","answers":["十分性"]},{"label":"②","answers":["支払能力"]},{"label":"③","answers":["収入"]}],"e":"完成：十分性／支払能力／収入。教科書1.2.1。"},{"id":"c1q5","level":"basic","type":"choice","tag":"公平性","q":"公平性について空欄の正しい組合せを選べ。\n\n理論的に（①）な公平性を実現する必要はなく、実務の（②）を念頭に置いて考える。","c":["①完璧／②簡素化","①平均的／②複雑化","①保険技術的／②収益化","①社会的／②標準化"],"a":0,"e":"完成：理論的に完璧な公平性を実現する必要はなく、実務の簡素化を念頭に置きます。教科書1.2.2。"},{"id":"c1q6","level":"basic","type":"input","tag":"収益性","q":"生命保険は販売後も契約が（①）にわたり継続するため、（②）にわたる収支を見通して収益性を評価する。最良推定ベースの前提を（③）という。","fields":[{"label":"①","answers":["長期間","長期"]},{"label":"②","answers":["将来"]},{"label":"③","answers":["ベストエスティメイト","ベスト・エスティメイト","bestestimate"]}],"e":"完成：長期間／将来／ベスト・エスティメイト。教科書1.2.3。"},{"id":"c1q7","level":"basic","type":"choice","tag":"価格競争力","q":"販売チャネルと価格競争力について空欄を埋めよ。\n\n他社商品との比較機会が多く、価格競争に晒されやすいのは（①）。きめ細かなコンサルティングが付加価値となるのは（②）。","c":["①乗り合い代理店／②会社専属募集人","①会社専属募集人／②乗り合い代理店","①団体保険／②通信販売","①銀行窓販／②再保険会社"],"a":0,"e":"完成：乗り合い代理店／会社専属募集人。教科書1.2.3。"},{"id":"c1q8","level":"basic","type":"input","tag":"保険料計算の2方式","q":"営業保険料の計算方法は国際的に大別して（①）typeと（②）type（またはprofit testing approach）の2通りであり、日本の実務では主に（③）typeが採用される。","fields":[{"label":"①","answers":["equation","Equation"]},{"label":"②","answers":["accumulation","Accumulation"]},{"label":"③","answers":["equation","Equation"]}],"e":"完成：Equation type／Accumulation type／Equation type。教科書1.3。"},{"id":"c1q9","level":"basic","type":"choice","tag":"Equation type","q":"Equation typeは、保険期間にわたる（①）現価と（②）現価が（③）となるよう方程式で営業保険料を算出する。","c":["①収入／②支出／③収支相等","①資産／②負債／③完全一致","①保険料／②配当／③利益最大","①新契約／②維持費／③費差ゼロ"],"a":0,"e":"完成：収入現価／支出現価／収支相等。教科書1.3.1。"},{"id":"c1q10","level":"basic","type":"input","tag":"Accumulation type","q":"Accumulation typeは、（①）を満たす営業保険料水準を、保険期間にわたる（②）や収支のシミュレーションによって定め、（③）としての収支構造も把握できる。","fields":[{"label":"①","answers":["利益目標"]},{"label":"②","answers":["アセットシェア","アセット・シェア","assetshare"]},{"label":"③","answers":["時系列"]}],"e":"完成：利益目標／アセット・シェア／時系列。教科書1.3.2。"},{"id":"c1q11","level":"basic","type":"keywords","tag":"主要な計算基礎率","q":"【列挙】営業保険料の計算で用いる主要な基礎率を4種類挙げよ（死亡・給付発生、利率、事業費、解約に関するもの）。","keys":[["予定死亡率","予定給付発生率"],["予定利率"],["予定事業費率","予定事業費"],["予定解約率"]],"e":"正答：予定死亡率（予定給付発生率）、予定利率、予定事業費率、予定解約率。順不同で判定します。教科書1.4。"},{"id":"c1q12","level":"basic","type":"choice","tag":"予定死亡率等","q":"予定死亡率・予定給付発生率等は、保険給付が将来（①）する確率に係る基礎率であり、予定する（②）の計算にも用いられる。通常は（③）別に設定する。","c":["①発生／②残存者／③性・年齢","①消滅／②解約者／③職業だけ","①増加／②契約高／③会社","①確定／②募集人／③商品名"],"a":0,"e":"完成：発生／残存者／性・年齢。教科書1.4.1。"},{"id":"c1q13","level":"basic","type":"input","tag":"予定利率","q":"予定利率は、将来の（①）による収益をあらかじめ見込み、その分だけ営業保険料を（②）する基礎率である。高く設定するほど一般に保険料は（③）なる。","fields":[{"label":"①","answers":["資産運用","運用"]},{"label":"②","answers":["割り引く","割引く","割引"]},{"label":"③","answers":["低く","安く"]}],"e":"完成：資産運用／割り引く／低く。商品構造により感応度には差があります。教科書1.4.3。"},{"id":"c1q14","level":"basic","type":"choice","tag":"予定事業費","q":"予定事業費を代表的な発生局面に分けると（①）、（②）、（③）である。","c":["①新契約費／②維持費／③集金費","①死亡費／②生存費／③解約費","①固定費／②変動費／③資本費","①直接費／②間接費／③税金"],"a":0,"e":"完成：新契約費／維持費／集金費。教科書1.4.4。"},{"id":"c1q15","level":"basic","type":"input","tag":"予定解約率","q":"低・無解約返戻金型商品では、解約給付を責任準備金より（①）することで生じる効果を保険料に織り込むため（②）を用いる。実績が予定を（③）と収支が悪化し得る。","fields":[{"label":"①","answers":["低く","少なく"]},{"label":"②","answers":["予定解約率"]},{"label":"③","answers":["下回る","下回った"]}],"e":"完成：低く／予定解約率／下回る。教科書1.4.2。"},{"id":"c1q16","level":"exam","type":"choice","tag":"過去問型・標準責任準備金","q":"空欄の正しい組合せを選べ。\n\n営業保険料の計算基礎率は各社が判断して決定し、標準責任準備金の（①）と必ずしも一致させる必要はない。責任準備金の積立水準は、期間通算の単純合計よりも収益認識の（②）に影響する。","c":["①標準基礎率／②時期","①予定事業費／②金額","①最良推定／②確率","①解約率／②販売量"],"a":0,"e":"完成：標準基礎率／時期。過去問で繰り返し問われる標準責任準備金との関係です。教科書1.2.3。"},{"id":"c1q17","level":"exam","type":"input","tag":"初期積立負担","q":"標準利率より（①）予定利率を設定した商品、特に（②）契約では、契約初期に大きな責任準備金の（③）が生じることがある。","fields":[{"label":"①","answers":["高い"]},{"label":"②","answers":["一時払","一時払い"]},{"label":"③","answers":["積立負担"]}],"e":"完成：高い／一時払／積立負担。教科書1.2.3。"},{"id":"c1q18","level":"exam","type":"choice","tag":"将来収入現価の制限","q":"標準基礎率による責任準備金計算で、将来収入現価としての純保険料Pが営業保険料πを（①）場合、（②）による将来収入現価を用いる。","c":["①上回る／②営業保険料","①下回る／②純保険料","①上回る／②標準保険料","①一致する／②付加保険料"],"a":0,"e":"完成：上回る／営業保険料。初期の積立負担が大きくなり得る点も重要です。教科書1.2.3。"},{"id":"c1q19","level":"exam","type":"keywords","tag":"Equation typeの利点","q":"【列挙】Equation typeの主な利点を示すキーワードを3つ入力せよ。","keys":[["一意","一意に定まる"],["再現性"],["利源分析","収支管理","リスク管理"]],"e":"正答例：計算結果が一意に定まる、再現性がある、利源分析が容易（収支管理・リスク管理上分析しやすい）。教科書1.3.1。"},{"id":"c1q20","level":"exam","type":"input","tag":"Equation typeの安全割増","q":"日本実務のEquation typeは、各計算基礎率に（①）を織り込む（②）方式である。総合的な十分性は確保されやすいが、十分性・収益性の程度や（③）は明示されにくい。","fields":[{"label":"①","answers":["安全割増"]},{"label":"②","answers":["内枠","内枠方式"]},{"label":"③","answers":["構造"]}],"e":"完成：安全割増／内枠方式／構造。教科書1.3.1。"},{"id":"c1q21","level":"exam","type":"choice","tag":"Accumulation typeの前提","q":"Accumulation typeでは、一般に計算基礎率や前提に（①）を行わないものを用い、必要利益を（②）に織り込む（③）方式と整理できる。","c":["①安全割増／②利益目標／③外枠","①平準化／②死亡率／③内枠","①割引／②標準基礎率／③外枠","①補間／②事業費／③内枠"],"a":0,"e":"完成：安全割増／利益目標／外枠方式。教科書1.3.2。"},{"id":"c1q22","level":"exam","type":"keywords","tag":"Accumulation typeで見えるもの","q":"【列挙】Accumulation typeで時系列に把握・可視化できる代表例を3つ入力せよ。","keys":[["新契約費","新契約費支出","新契約費回収"],["責任準備金","積立負担"],["ソルベンシーマージン","内部留保","必要内部留保"]],"e":"正答例：新契約費支出の回収、責任準備金の積立負担、ソルベンシー・マージン確保のための必要内部留保の推移。教科書1.3.2。"},{"id":"c1q23","level":"exam","type":"input","tag":"死亡率設定","q":"死亡率設定では、データの（①）を確認し、必要に応じて補整する。死亡保障で死亡率上昇が危険なら最良推定に安全割増を（②）し、生存保障で長寿が危険なら死亡率を安全割（③）方向があり得る。","fields":[{"label":"①","answers":["信頼性","十分性"]},{"label":"②","answers":["加算","上乗せ"]},{"label":"③","answers":["引","引く"]}],"e":"完成：信頼性／加算／引く。保障内容によりリスク方向が逆になる点が頻出です。教科書1.4.1。"},{"id":"c1q24","level":"exam","type":"choice","tag":"リスク細分","q":"健康優良体や引受緩和型商品の料率区分では、データに基づく（①）に加え、（②）を含む公平性を丁寧に検討する。","c":["①保険数理的合理性／②社会的容認性","①営業目標／②広告効果","①標準利率／②販売件数","①収支相等／②再現性"],"a":0,"e":"完成：保険数理的合理性／社会的容認性。教科書1.4.1・1.5。"},{"id":"c1q25","level":"exam","type":"keywords","tag":"保険料率の代表的区分","q":"【列挙】保険料率を区分する代表的な属性・単位を5つ入力せよ。","keys":[["保険種類","商品"],["年齢"],["性別","男女"],["保険金額","金額"],["払方","払込方法","保険料払込方法"]],"e":"正答例：保険種類、年齢、性別、保険金額、保険料払込方法。商品により健康状態、職業、喫煙状況等も料率区分となります。"},{"id":"c1q26","level":"exam","type":"input","tag":"解約率の特徴","q":"解約率は商品、販売チャネル、経過年数、（①）環境等に左右される。低解約返戻金型で予定解約率を高くすると保険料を（②）できる一方、実績解約率の（③）が収益悪化要因となる。","fields":[{"label":"①","answers":["経済","金利"]},{"label":"②","answers":["低廉化","引き下げ","安く"]},{"label":"③","answers":["下振れ","低下"]}],"e":"完成例：経済／低廉化／下振れ。教科書1.4.2。"},{"id":"c1q27","level":"exam","type":"choice","tag":"リスク濃縮","q":"健康な契約者ほど解約して高リスク者が残り、残存群団の給付発生率が上昇する現象は（①）。この影響は契約者の（②）と給付リスクの相関から生じる。","c":["①リスク濃縮／②行動","①危険分散／②年齢","①収支相等／②配当","①平準化／②募集"],"a":0,"e":"完成：リスク濃縮／行動。予定解約率は件数減少だけでなく残存群団の質にも影響します。"},{"id":"c1q28","level":"exam","type":"input","tag":"予定利率の留意点","q":"予定利率設定では、自社の運用利回り、（①）投資利回り、将来の運用方針、商品特性、価格競争力等を考慮する。平準払では将来流入保険料の（②）リスク、一時払では金利上昇時の（③）リスクにも留意する。","fields":[{"label":"①","answers":["新規","新規投資"]},{"label":"②","answers":["再投資"]},{"label":"③","answers":["解約","債券売却損","売却損"]}],"e":"完成例：新規／再投資／解約（債券売却損）。2023年度過去問でも予定利率設定の留意事項が問われています。"},{"id":"c1q29","level":"exam","type":"choice","tag":"商品別金利感応度","q":"一般に積立部分が大きい（①）は予定利率の影響が大きく、積立部分が小さい（②）は相対的に影響が小さい。","c":["①養老保険／②定期保険","①定期保険／②養老保険","①医療特約／②終身保険","①団体定期／②年金保険"],"a":0,"e":"完成：養老保険／定期保険。ただし保険料の変化方向・程度は算式や費用構造にも依存します。"},{"id":"c1q30","level":"exam","type":"keywords","tag":"予定利率設定の観点","q":"【過去問型・列挙】保険料計算基礎率として予定利率を設定する際の留意事項を4つ入力せよ。","keys":[["運用利回り","自社運用利回り"],["新規投資利回り","新規投資"],["将来の運用方針","運用方針"],["商品特性","価格競争力","ALM","金利リスク"]],"e":"正答例：自社運用利回り、新規投資利回り、将来の運用方針、商品特性・価格競争力・ALM。2023年度生保1の出題テーマを穴埋め化。"},{"id":"c1q31","level":"exam","type":"input","tag":"予定事業費の原則","q":"原則として、ある保険（①）の運営に必要な事業費は、その群団の（②）で賄うことが望ましい。恒常的な他群団からの補填は群団間の（③）を損ない得る。","fields":[{"label":"①","answers":["群団"]},{"label":"②","answers":["予定事業費","付加保険料"]},{"label":"③","answers":["公平性"]}],"e":"完成：群団／予定事業費／公平性。教科書1.4.4・1.5。"},{"id":"c1q32","level":"exam","type":"choice","tag":"事業費賦課原則","q":"実際の費用発生構造に対応して負担させる考え方を（①）、契約者が得る便益・効用に応じて負担させる考え方を（②）という。","c":["①費用主義／②効用主義","①効用主義／②費用主義","①十分性原則／②公平性原則","①内枠方式／②外枠方式"],"a":0,"e":"完成：費用主義／効用主義。教科書1.4.4。"},{"id":"c1q33","level":"exam","type":"keywords","tag":"α-β-γ方式","q":"【列挙】α-β-γ方式が対応させる3種類の予定事業費を入力せよ。","keys":[["新契約費","α","アルファ"],["維持費","β","ベータ"],["集金費","γ","ガンマ"]],"e":"正答：新契約費、維持費、集金費。順不同で判定します。教科書1.4.4。"},{"id":"c1q34","level":"exam","type":"input","tag":"インフレーション","q":"予定事業費設定では、将来の（①）による費用上昇や、顧客（②）の高度化によるコストも見込む。長期契約では固定額費用の実質負担が変化するため（③）検証が重要である。","fields":[{"label":"①","answers":["インフレーション","物価上昇"]},{"label":"②","answers":["サービス","service"]},{"label":"③","answers":["将来収支","収益性","ストレス"]}],"e":"完成例：インフレーション／サービス／将来収支。2023年度過去問の物価上昇と収益性の論点にも対応。"},{"id":"c1q35","level":"exam","type":"choice","tag":"有配当・無配当","q":"有配当保険は基礎率に相応の（①）を含め、剰余の一部を（②）として還元する。無配当保険は還元見合いを除き、表面保険料を（③）できる場合がある。","c":["①安全割増／②契約者配当／③低廉化","①解約控除／②責任準備金／③増額","①標準基礎率／②事業費／③固定","①危険差／②保険金／③平準化"],"a":0,"e":"完成：安全割増／契約者配当／低廉化。教科書1.4.5。"},{"id":"c1q36","level":"exam","type":"input","tag":"公平性原則","q":"同じ保険料で保障される被保険者集団は同一の（①）を有するべきだという考えを（②）的公平性という。ただし細分化は統計的信頼性や（③）的容認性との均衡が必要である。","fields":[{"label":"①","answers":["危険度","リスク"]},{"label":"②","answers":["保険技術","保険技術的"]},{"label":"③","answers":["社会","社会的"]}],"e":"完成：危険度／保険技術的／社会的。教科書1.5.1。"},{"id":"c1q37","level":"exam","type":"keywords","tag":"十分性と公平性","q":"【過去問型・列挙】保険料率改定を検討する際、少なくとも説明すべき3つの基本観点を入力せよ。","keys":[["十分性"],["公平性"],["収益性"]],"e":"正答：十分性、公平性、収益性。2023年度生保1では終身保険の料率改定について、この3観点からの説明が求められました。"},{"id":"c1q38","level":"exam","type":"choice","tag":"金利上昇と終身保険","q":"低金利時に設定した平準払終身保険で市中金利が上昇した場合、価格競争力は（①）し得る一方、保有資産の含み損や（②）の増加、将来保険料の運用利回り改善等を総合評価する。","c":["①低下／②解約","①上昇／②死亡","①不変／②新契約","①消滅／②配当"],"a":0,"e":"完成：低下／解約。金利上昇の影響は新契約価格・保有契約・資産運用で方向が異なります。2023年度過去問テーマ。"},{"id":"c1q39","level":"exam","type":"input","tag":"物価上昇と収益性","q":"平準払終身保険で物価上昇率が高まると、名目額固定の保険料収入に対し、維持費等の（①）が増えて（②）が悪化し得る。一方、名目金利上昇による運用収益改善の可能性も含め（③）的に検証する。","fields":[{"label":"①","answers":["事業費","費用"]},{"label":"②","answers":["費差収支","収益性","費差益"]},{"label":"③","answers":["総合","総合的"]}],"e":"完成例：事業費／費差収支／総合的。2023年度過去問テーマ。"},{"id":"c1q40","level":"exam","type":"choice","tag":"販売後モニタリング","q":"予定解約率と予定利率を高めに設定した低解約返戻金型終身保険では、（①）、（②）、新契約費回収、責任準備金積立負担を複合的にモニタリングする。","c":["①実績解約率／②資産運用利回り","①広告閲覧数／②募集人数","①標準死亡率だけ／②株価だけ","①契約者住所／②商品名"],"a":0,"e":"完成：実績解約率／資産運用利回り。複数のリスクドライバーを一体で追います。"},{"id":"c1q41","level":"hard","type":"keywords","tag":"総合料率区分","q":"【難問・列挙】個人保険の料率細分で検討し得る区分を8つ入力せよ。","keys":[["保険種類","商品"],["年齢"],["性別","男女"],["保険金額","金額"],["払方","払込方法"],["健康状態","健康"],["職業"],["喫煙","喫煙状況"]],"e":"正答例：保険種類、年齢、性別、保険金額、払込方法、健康状態、職業、喫煙状況。商品特性とデータの合理性に応じて選びます。"},{"id":"c1q42","level":"hard","type":"input","tag":"標準責任準備金と資本","q":"低廉な保険料により標準責任準備金の積立を群団内で賄えない場合、他群団の（①）または会社勘定である（②）から立て替える。恒常的な立替えは（③）しくない。","fields":[{"label":"①","answers":["剰余"]},{"label":"②","answers":["内部留保"]},{"label":"③","answers":["好ま","望ま"]}],"e":"完成：剰余／内部留保／好ましくない。教科書1.2.3。"},{"id":"c1q43","level":"hard","type":"choice","tag":"初期投資の見方","q":"標準責任準備金の積立を将来収益のための（①）とみる考え方があるが、保険料の（②）を招きやすい可能性があり、十分性判断には（③）な検討が必要である。","c":["①初期投資／②不足／③慎重","①配当／②超過／③簡略","①解約益／②平準化／③短期的","①費差益／②一致／③形式的"],"a":0,"e":"完成：初期投資／不足／慎重。教科書1.2.3。"},{"id":"c1q44","level":"hard","type":"keywords","tag":"基礎率設定プロセス","q":"【難問・列挙】データの乏しい新医療保障で予定給付発生率を設定する際の検討キーワードを5つ入力せよ。","keys":[["データ定義","定義整合","整合性"],["補整","補間","補外"],["将来トレンド","トレンド"],["不確実性"],["安全割増"]],"e":"正答例：データ定義の整合、補整・補間・補外、将来トレンド、不確実性、安全割増。教科書1.4.1。"},{"id":"c1q45","level":"hard","type":"input","tag":"方式の併用","q":"Equation typeは料率の（①）と利源別把握に強く、Accumulation typeは利益・資本・費用回収の（②）的検証に強い。実務では両者を（③）して十分性と収益性を確認できる。","fields":[{"label":"①","answers":["再現性"]},{"label":"②","answers":["時系列"]},{"label":"③","answers":["併用"]}],"e":"完成：再現性／時系列／併用。方式の長所を目的別に使い分けます。"},{"id":"c1q46","level":"hard","type":"choice","tag":"予定利率変動型","q":"予定利率変動型商品では、利率の（①）期間に対応する資産運用を検討する。資産を短期化すると長期の（②）リスクは軽減し得るが、見直し時の利回り低下を負う。","c":["①見直し／②再投資","①据置／②死亡","①払込／②解約控除","①保障／②事業費"],"a":0,"e":"完成：見直し／再投資。ALMと保証期間の整合が重要です。教科書1.4.5。"},{"id":"c1q47","level":"hard","type":"keywords","tag":"総合モニタリング","q":"【難問・列挙】競争力重視で保険料を引き下げた商品の販売後に確認すべき項目を6つ入力せよ。","keys":[["死亡率","給付発生率"],["解約率"],["運用利回り","金利"],["事業費","費用"],["責任準備金","積立負担"],["収益性","利益","資本"]],"e":"正答例：死亡・給付発生率、解約率、運用利回り、事業費、責任準備金積立負担、収益性・資本。"},{"id":"c1q48","level":"hard","type":"input","tag":"有配当・無配当の比較","q":"有配当・無配当商品の比較では、表面保険料だけでなく、基礎率の（①）、配当後の（②）的負担、収支悪化時の（③）力を比較する。","fields":[{"label":"①","answers":["安全割増"]},{"label":"②","answers":["実質","実質的"]},{"label":"③","answers":["対応","リスク対応"]}],"e":"完成：安全割増／実質的／対応。無配当が常に有利とは限りません。"},{"id":"c1q49","level":"hard","type":"choice","tag":"総合ケース","q":"料率改定では、十分性・公平性・収益性に加え、標準責任準備金の（①）、価格（②）、販売量、資本・流動性への影響を（③）的に判断する。","c":["①積立負担／②競争力／③総合","①予定死亡率／②弾力性だけ／③短期","①解約控除／②表示／③機械","①利源／②統制／③個別"],"a":0,"e":"完成：積立負担／競争力／総合。2023年度の料率改定型論述をキーワード穴埋めに再構成。"},{"id":"c1q50","level":"hard","type":"keywords","tag":"最終総点検","q":"【最終・列挙】営業保険料設定を総合判断する際の重要語を7つ入力せよ。","keys":[["十分性"],["公平性"],["収益性"],["標準責任準備金","積立負担"],["価格競争力"],["不確実性","安全割増"],["モニタリング","事後検証"]],"e":"正答例：十分性、公平性、収益性、標準責任準備金・積立負担、価格競争力、不確実性・安全割増、モニタリング。第1章の総まとめです。"}]},"2":{"title":"第2章「解約および解約返戻金」","short":"解約および解約返戻金","desc":"直接入力・キーワード列挙・選択式を混在。解約控除、予定解約率、払済・転換、契約者貸付、MVA、過去問頻出語句など。","source":"日本アクチュアリー会 生保1 第2章公式テキスト・過去問論点","bank":[{"id":"c2q1","level":"basic","type":"input","tag":"解約返戻金の基本","q":"解約返戻金の設定では、支出した（①）や資産運用上の損失、保険設計上の仕組み等を踏まえ、（②）かつ妥当に設定し、契約者に不当に（③）なものとならないようにする。","fields":[{"label":"①","answers":["事業費"]},{"label":"②","answers":["合理的"]},{"label":"③","answers":["不利益"]}],"e":"完成：事業費／合理的／不利益。","detail":"監督上の考え方では、解約返戻金は単なる『積立金の返金』ではありません。契約獲得時に先行して支出した事業費、解約に伴う資産売却上の不利益、商品の給付構造などを踏まえて合理的に設定します。同時に、会社側の都合だけで過度に低くすることは許されず、契約者保護との均衡が必要です。","tip":"『事業費・合理的・不当に不利益』の3語を一塊で覚えます。2021年度の監督指針関連の穴埋めと同型の論点です。"},{"id":"c2q2","level":"basic","type":"keywords","tag":"解約控除の理由","q":"【列挙】解約控除を設ける理由・背景として説明できるキーワードを4つ挙げよ。","keys":[["新契約費","未回収新契約費"],["投資上の損失","資産売却損","投資上の不利益"],["公平性","契約者間の公平性"],["健全性","財務の健全性"]],"e":"正答例：未回収新契約費、投資上の損失、契約者間の公平性、健全性。","detail":"契約初期には新契約費が先行します。早期解約者へ高い返戻金を支払うと、その未回収費用を継続者が負担する構造になりやすく、公平性を損ないます。また金利上昇局面では資産売却損も生じ得るため、解約控除には費用回収だけでなく資産運用・健全性の意味もあります。","tip":"列挙問題では『費用・投資・公平・健全』の4本柱で書けるようにします。"},{"id":"c2q3","level":"basic","type":"choice","tag":"責任準備金との関係","q":"解約返戻金と責任準備金の関係について最も適切なものはどれか。","c":["両者は目的が異なるため常に一致するわけではなく、その差額は解約時の収支や公平性に影響する。","両者は法令上常に完全一致しなければならない。","解約返戻金は責任準備金より常に大きくなければならない。","両者の差は会社収支に一切影響しない。"],"a":0,"e":"解約返戻金と責任準備金は目的が異なるため、常に一致するわけではありません。","detail":"責任準備金は将来の保険債務履行のための準備であり、解約返戻金は契約が途中で消滅した場合に支払う給付です。両者の差が会社側に残れば解約益となり得ますが、その利益の帰属や継続者との公平性まで考える必要があります。","tip":"『目的が違う→一致不要→差額が収支に影響』の流れで押さえます。"},{"id":"c2q4","level":"basic","type":"input","tag":"低解約返戻金型","q":"低解約返戻金型商品では、一定期間の解約返戻金を通常より（①）することで、その効果を保険料計算に反映し、営業保険料を（②）できる場合がある。その際、（③）が重要な計算基礎となる。","fields":[{"label":"①","answers":["低く","抑制"]},{"label":"②","answers":["低廉化","低く","安く"]},{"label":"③","answers":["予定解約率"]}],"e":"完成：低く／低廉化／予定解約率。","detail":"低解約返戻金型では、解約時に会社へ残る価値をあらかじめpricingへ織り込むことで保険料を低くできます。ただし、その利益は契約者が予定どおり解約することを前提にしているため、予定解約率の設定が重要なrisk driverになります。","tip":"『返戻金低下→解約益見込み→保険料低廉化→予定解約率risk』まで一本で説明します。"},{"id":"c2q5","level":"basic","type":"choice","tag":"予定解約率の保守性","q":"低解約返戻金型商品の予定解約率について最も適切なものはどれか。","c":["予定解約率が高いほど常に保守的である。","予定解約率が高いほど保険料を低くできる場合があるが、実績が予定を下回ると想定した解約益が不足するため、必ずしも保守的ではない。","予定解約率は保険料計算に影響しない。","予定解約率は死亡率と必ず同一にする。"],"a":1,"e":"予定解約率は『高いほど保守的』ではありません。","detail":"低解約返戻金型では高い予定解約率を置くほど解約益を多く見込めるため、営業保険料を下げやすくなります。しかし実績解約率が下振れすると、想定した解約益が得られず収益性が悪化します。通常の死亡保障における死亡率の安全割増とは方向感が異なる点が重要です。","tip":"試験では『予定解約率を高めた＝安全側』という誤答を狙われやすいです。"},{"id":"c2q6","level":"basic","type":"keywords","tag":"解約率の変動要因","q":"【列挙】解約率を分析・設定するときに区分・確認したい代表的な要因を6つ挙げよ。","keys":[["経過年数"],["商品","商品種類"],["販売チャネル","チャネル"],["金利","経済環境"],["年齢"],["保険料払込状況","払込期間","払込満了"]],"e":"正答例：経過年数、商品、販売チャネル、金利・経済環境、年齢、保険料払込状況。","detail":"解約率は死亡率以上に契約者行動の影響を強く受けます。経過年数や商品性、販売チャネルに加え、市場金利、家計環境、払込満了などでも大きく変わります。したがって単一の一律率ではなく、実績の切り口を持って分析する必要があります。","tip":"『経過・商品・チャネル・金利・年齢・払込』を基本セットにします。"},{"id":"c2q7","level":"basic","type":"choice","tag":"解約益","q":"責任準備金100、解約返戻金70の契約が解約した場合、単純化して会社側に残る差額30の効果を何と呼ぶことがあるか。","c":["解約益","死差損","費差損","逆ざや"],"a":0,"e":"差額30は解約益と捉えられます。","detail":"実際の収益計算では会計・費用・資産売却等も関係しますが、教科書理解としては責任準備金等の契約価値と解約返戻金との差が会社側に残る効果を解約益と整理します。低解約返戻金型のpricingではこの解約益を見込むことがあります。","tip":"解約益は『解約が多いほど必ず良い』ではないこともセットで覚えます。"},{"id":"c2q8","level":"basic","type":"input","tag":"契約者貸付","q":"契約者貸付や保険料自動振替貸付では、通常、貸付可能額を（①）の範囲内に制限する。これは将来契約が消滅した際に貸付残高を（②）できるようにするためである。","fields":[{"label":"①","answers":["解約返戻金"]},{"label":"②","answers":["精算","相殺"]}],"e":"完成：解約返戻金／精算（相殺）。","detail":"契約者貸付は契約価値を担保的に用いる制度です。無制限に貸し付けると、契約消滅時に回収できないため、解約返戻金を基礎として限度額を設定します。","tip":"『貸付限度額＝解約返戻金ベース』を即答できるようにします。"},{"id":"c2q9","level":"basic","type":"choice","tag":"払済保険","q":"払済保険への変更について最も適切な説明はどれか。","c":["以後の保険料払込を停止し、その時点の契約価値を原資に保障額などを変更して契約を継続する。","契約を完全に消滅させる。","死亡保険金を必ずゼロにする。","責任準備金を全額会社利益にする。"],"a":0,"e":"払済保険は、保険料払込を止めつつ保障を継続する取扱いです。","detail":"通常はその時点の解約返戻金等の契約価値を原資として、保障額を減額するなどして契約を継続します。したがって無解約返戻金型では、払済変更の原資をどう考えるかが商品設計上の重要論点になります。","tip":"『払込停止・契約継続・原資は契約価値』の3点を押さえます。"},{"id":"c2q10","level":"basic","type":"keywords","tag":"契約消滅・縮小時の取扱い","q":"【列挙】解約返戻金との整合を考えるべき契約消滅・契約縮小等の取扱いを4つ挙げよ。","keys":[["解約"],["払済","払済保険"],["転換"],["契約者貸付","自動振替貸付"]],"e":"正答例：解約、払済保険への変更、転換、契約者貸付。","detail":"同じ契約価値を基礎にする複数制度の間で経済価値が大きく不整合になると、契約者が一番有利な制度だけを選択することがあります。その結果、会社収支や契約者間の公平性が崩れる可能性があります。","tip":"単独制度ではなく『横断整合性』が論述で使えるキーワードです。"},{"id":"c2q11","level":"exam","type":"keywords","tag":"MVAの概要","q":"【過去問型・列挙】MVA（Market Value Adjustment）の概要・意義を説明するときに必要なキーワードを5つ挙げよ。","keys":[["市場金利"],["運用資産","資産価格"],["解約返戻金"],["資産売却損","売却損"],["公平性","流動性","健全性"]],"e":"正答例：市場金利、運用資産価格、解約返戻金、資産売却損、公平性・流動性。","detail":"MVAは、市場金利の変動に応じた運用資産の価格変動を解約返戻金へ反映する仕組みです。金利上昇局面で資産価格が低下しているのに契約者価額をそのまま払い戻すと、売却損を残存契約者や会社が負担します。MVAはこの負担を解約者へ適切に反映し、金利risk・流動性riskを軽減します。","tip":"2019年度では『MVAの概要、意義、解約時利率設定上の留意点』がまとまって問われました。"},{"id":"c2q12","level":"exam","type":"input","tag":"MVAの基本関係","q":"一般的なMVAでは、契約時の利率を i1、解約時の利率を i2 とすると、i2 が i1 より（①）場合、解約返戻金は契約者価額より（②）方向に調整される。","fields":[{"label":"①","answers":["高い","上回る"]},{"label":"②","answers":["低く","減額","減少"]}],"e":"完成：高い／低く（減額）。","detail":"市場金利が上昇すると既発の固定利付資産の価格は下落します。MVAはその下落を解約返戻金へ反映するため、解約時利率が契約時利率より高い場合には返戻金を減額する方向になります。","tip":"2019・2024年度のMVA数値計算の方向感を、まず言葉で即答できるようにします。"},{"id":"c2q13","level":"exam","type":"choice","tag":"MVA・2024年度型","q":"2024年度のMVA関連出題で問われた組合せとして最も適切なものはどれか。","c":["契約概要／市場金利／運用資産／損失","注意喚起情報／予定利率／責任準備金／配当","約款／標準利率／特別勘定／死亡保険金","契約概要／死亡率／アセット・シェア／事業費"],"a":0,"e":"契約概要／市場金利／運用資産／損失、の組合せです。","detail":"監督指針上、MVA商品では契約締結前交付書面に、市場金利に応じた運用資産価格の変動を解約返戻金へ反映することや、一定期間内の解約では損失が生じ得ること等を記載します。2024年度はこの表現が穴埋め形式で直接問われました。","tip":"4語をそのまま記憶する価値が高い過去問頻出セットです。"},{"id":"c2q14","level":"exam","type":"keywords","tag":"MVA・契約者への説明","q":"【過去問型・列挙】MVA商品について契約者へ説明すべき事項を4つ挙げよ。","keys":[["市場金利","金利変動"],["運用資産","資産価格"],["元本割れ","損失"],["諸費用","取引費用","係数"]],"e":"正答例：市場金利と資産価格の関係、解約返戻金への反映、元本割れの可能性、諸費用・係数の影響。","detail":"MVAは仕組みが複雑で、金利上昇時に返戻金が大きく減少する可能性があります。そのため『市場金利が動く→運用資産価格が動く→解約返戻金が変わる→元本割れもあり得る』という因果関係を契約者が理解できる形で説明する必要があります。","tip":"2024年度の監督指針問題を、語句暗記だけでなく説明まで再現できるようにします。"},{"id":"c2q15","level":"exam","type":"keywords","tag":"MVA・解約時利率 i2","q":"【過去問型・列挙】MVAで解約時利率 i2 を設定するときの留意点を5つ挙げよ。","keys":[["市場金利"],["残存期間","期間構造"],["タイムラグ","time lag"],["恣意性","合理的"],["実務負荷","契約者理解"]],"e":"正答例：市場金利、残存期間・期間構造、time lag、合理性・恣意性排除、実務負荷・契約者理解。","detail":"i2 は単に『その日の長期金利』を使えばよいわけではありません。契約の残存期間に対応する市場金利を選び、基礎を設定する時点と解約時点のずれを考え、恣意的な操作ができない合理的なルールにします。また頻繁な更新が必要になるため実務可能性も重要です。","tip":"2019年度の記述問題で直接問われた核心論点です。"},{"id":"c2q16","level":"exam","type":"choice","tag":"MVA・係数","q":"解約返戻金額の計算基礎を設定する時期と解約時期の間の金利変動や、資産売却に伴う取引費用等へ備える係数について最も適切なものはどれか。","c":["合理的かつ妥当な水準に設定し、契約者に不当に不利益とならないようにする。","会社が利益最大化のため自由に決めればよい。","常に10%に固定する。","契約者へ影響を説明する必要はない。"],"a":0,"e":"係数も合理的かつ妥当に設定する必要があります。","detail":"2021年度の監督指針関連では、MVA係数について市場環境や資産売却時の取引費用等との整合性を踏まえ、契約者に不当に不利益な水準とならないことが問われています。係数は会社の裁量的な隠れ控除ではありません。","tip":"『合理的・妥当・不当に不利益でない』は監督指針系で繰り返し使える表現です。"},{"id":"c2q17","level":"exam","type":"input","tag":"MVA・2024数値の方向","q":"2024年度の例では、契約時利率5%、解約時利率7%、MVA係数0.20%、契約者価額741,000円の6年経過解約について、解約返戻金は約（①）円となった。","fields":[{"label":"①","answers":["682000","682,000","68万2000","682千"]}],"e":"正答：約682,000円。","detail":"市場金利が5%から7%へ上昇しているため、残存4年分について割引調整がかかり、741,000円より低い約682,000円となります。数式を丸暗記するだけでなく、『金利上昇→資産価格下落→返戻金減少』という方向感を確認します。","tip":"2024年度の実数値。答えの682,000円は頻出過去問のアンカーとして覚えておくとよいです。"},{"id":"c2q18","level":"exam","type":"choice","tag":"MVA・流動性","q":"MVAが流動性riskの軽減に寄与する理由として最も適切なものはどれか。","c":["金利上昇時の解約者へ市場価値低下を反映することで、会社が資産売却損を全面的に負担する状況や大量解約のincentiveを抑え得るため。","契約者が一切解約できなくなるため。","運用資産をすべて現金化するため。","死亡率が低下するため。"],"a":0,"e":"MVAは資産売却損と大量解約incentiveの双方を抑える方向に働きます。","detail":"金利上昇時に市場価格を反映しない返戻金を保証すると、契約者は割高な価格で解約でき、会社は安くなった資産を売却して支払うことになります。MVAはその不整合を調整し、流動性・公平性を改善します。","tip":"『asset-liabilityの不整合を解約価額で補正する』と説明できれば強いです。"},{"id":"c2q19","level":"exam","type":"input","tag":"低解約返戻金型・解約率下振れ","q":"低解約返戻金型で、実績解約率が予定解約率を（①）と、想定していた（②）が不足し、収益性が（③）する可能性がある。","fields":[{"label":"①","answers":["下回る","下振れ"]},{"label":"②","answers":["解約益"]},{"label":"③","answers":["悪化","低下"]}],"e":"完成：下回る／解約益／悪化。","detail":"予定解約率をpricingへ織り込む商品では、契約者が一定割合で離脱すること自体が保険料低廉化の前提になっています。実績が低いと会社に残る解約益が減るため、通常の『継続率が高いほど良い』という感覚が必ずしも当てはまりません。","tip":"この逆説は第1章の予定解約率と第2章の商品設計をつなぐ重要論点です。"},{"id":"c2q20","level":"exam","type":"choice","tag":"低解約返戻金型・上振れ","q":"実績解約率が予定を上回った場合に『必ず会社に有利』とはいえない理由として最も適切なものはどれか。","c":["解約益だけでなく、将来収益の消失、資産売却、流動性、顧客保護・評判なども影響するため。","解約率は収支に影響しないため。","解約返戻金が常に責任準備金を上回るため。","死亡率が必ずゼロになるため。"],"a":0,"e":"解約率上振れも総合的に評価する必要があります。","detail":"短期的には解約益が増えることがあっても、将来得られるはずだった費差益・利差益等が消失します。また大量解約なら資産売却や流動性の問題も発生します。したがって単純な解約益だけで有利・不利を判断しません。","tip":"試験では一方向の結論を避け、『他の条件も含めて総合判断』と書けることが重要です。"},{"id":"c2q21","level":"exam","type":"keywords","tag":"低解約返戻金型・monitoring","q":"【列挙】低解約返戻金型商品の販売後monitoringで確認すべき項目を6つ挙げよ。","keys":[["実績解約率","解約率"],["予定解約率"],["解約益"],["経過年数","cliff"],["収益性","利益"],["苦情","契約者行動","顧客保護"]],"e":"正答例：実績解約率、予定解約率、解約益、経過年数別cliff、収益性、苦情・契約者行動。","detail":"予定解約率の妥当性は販売後に実績で検証します。特に返戻金が急増する節目ではcliffが起きるため、経過年数別に見る必要があります。数値だけでなく、解約理由や苦情など契約者行動の質的情報も有用です。","tip":"『実績・予定・益・経過・利益・顧客』の6語で覚えます。"},{"id":"c2q22","level":"exam","type":"choice","tag":"cliff","q":"保険料払込期間中は低解約返戻金、払込満了後に通常水準へ戻る商品で注意すべき現象はどれか。","c":["払込満了前後で解約率が急変するcliff","死亡率の自動低下","予定利率の自動上昇","保険料の自動返還"],"a":0,"e":"払込満了前後のcliffが重要です。","detail":"返戻金水準が不連続に上昇する場合、契約者は『あと少し待てば返戻金が増える』と考えて解約を先送りし、満了直後にまとめて解約する可能性があります。一定の予定解約率ではこの行動を捉えられません。","tip":"商品設計の節目と契約者行動を結び付ける典型問題です。"},{"id":"c2q23","level":"exam","type":"choice","tag":"無解約返戻金型・払済","q":"無解約返戻金型平準払終身保険で払済保険への変更を認めない設計理由として最も適切なものはどれか。","c":["払済変更原資を解約返戻金と考える場合、無解約返戻金型では十分な原資が存在しないため。","払済保険は法令上一律禁止だから。","払済変更すると死亡率が必ず上がるから。","払済変更すると予定利率がゼロになるから。"],"a":0,"e":"無解約返戻金型では払済変更の原資との整合が問題になります。","detail":"払済変更では通常、契約時点の価値を原資に保障を縮小して継続します。ところが解約返戻金をゼロとしている商品で払済価値だけ大きく認めると、解約との間に不整合が生じます。2021年度にはこの周辺論点が出題されています。","tip":"『払済原資＝解約返戻金』と『制度間公平性』をセットで整理します。"},{"id":"c2q24","level":"exam","type":"keywords","tag":"転換価格","q":"【過去問型・列挙】転換制度で『転換価格』を構成する代表的な要素を3つ挙げよ。","keys":[["責任準備金","保険料積立金"],["配当","積立配当金"],["解約返戻金","契約者価額","転換価格"]],"e":"正答例：保険料積立金・責任準備金相当、積立配当金等、契約価値に係る要素。","detail":"転換制度では旧契約の経済価値を新契約へ引き継ぐため、旧契約に蓄積された価値を適切に評価します。2021年度では転換価格の構成要素と、転換価格以外に引き継ぐ要素をそれぞれ列挙する問題が出ました。","tip":"実際の表現は約款・商品により異なります。試験では教科書の列挙語を正確に再現する意識が重要です。"},{"id":"c2q25","level":"exam","type":"keywords","tag":"転換で引き継ぐ要素","q":"【過去問型・列挙】転換価格以外に、転換前契約から新契約へ引き継ぐべき要素として考えられるものを3つ挙げよ。","keys":[["契約日","加入時期"],["責任開始","保険年齢","年齢"],["告知","危険選択","健康状態"]],"e":"正答例：契約日・加入時期、年齢・責任開始に関する要素、危険選択・告知に関する要素。","detail":"転換では単に金銭的な価値だけでなく、旧契約で既に経過した期間や危険選択の効果など、契約者に帰属する権利・条件をどこまで引き継ぐかが公平性上重要です。","tip":"2021年度の列挙問題を意識し、『価格以外の引継ぎ』という枠で覚えます。"},{"id":"c2q26","level":"exam","type":"choice","tag":"制度間arbitrage","q":"解約・払済変更・転換の経済価値に大きな差がある場合に最も懸念されるものはどれか。","c":["契約者が最も有利な取扱いへ集中し、会社収支や契約者間の公平性が損なわれること。","死亡率が必ず一定になること。","事業費が必ずゼロになること。","標準利率が自動的に変更されること。"],"a":0,"e":"制度間の経済価値に不整合があると契約者行動が歪みます。","detail":"契約者は合理的に最も有利な手続きを選びます。設計者が各制度を独立に決めると、解約より払済の方が著しく有利などのarbitrage的状況が生まれ、想定していないcash flowや公平性問題を引き起こします。","tip":"『制度横断・経済価値・契約者行動』の3語が論述で使えます。"},{"id":"c2q27","level":"exam","type":"keywords","tag":"公平性の観点","q":"【列挙】解約返戻金制度で公平性を検討するときの比較対象を4つ挙げよ。","keys":[["解約者"],["継続者","残存者"],["払済変更者","払済"],["転換者","転換"]],"e":"正答例：解約者、継続者、払済変更者、転換者。","detail":"公平性は『解約者対会社』だけではありません。早期解約者と長期継続者、解約者と払済変更者、旧契約を転換する契約者など複数の契約者群団間で経済価値の移転が起きないかを見ます。","tip":"誰と誰の公平性かを明示すると記述答案が具体的になります。"},{"id":"c2q28","level":"exam","type":"choice","tag":"解約益の帰属","q":"有配当商品で大きな解約益が発生した場合の検討として最も適切なものはどれか。","c":["解約益の発生源と帰属を分析し、残存者配当や消滅時配当等を含め公平性を検討する。","必ず全額を会社利益とする。","必ず全額を残存者へ配当する。","必ず全額を解約者へ返す。"],"a":0,"e":"解約益の帰属は公平性を踏まえて検討します。","detail":"解約益は脱退者が残していった経済価値に由来する面があります。全額を残存者へ回せば解約者との公平性、全額を会社に帰属させれば契約者還元との関係が問題になります。消滅時配当という考え方も一つの調整手段です。","tip":"『利益が出た→誰の貢献か→誰へ還元するか』の順に考えます。"},{"id":"c2q29","level":"exam","type":"input","tag":"消滅時配当","q":"解約など契約消滅時に、契約者へ剰余の一部を還元する配当を（①）配当という。","fields":[{"label":"①","answers":["消滅時","消滅時配当"]}],"e":"正答：消滅時配当。","detail":"解約益やサープラスの一部を、契約が消滅する契約者へ還元する考え方です。残存者だけへ利益を帰属させず、脱退者との公平性を調整する手段となり得ます。","tip":"名称を一語で即答できるようにします。"},{"id":"c2q30","level":"exam","type":"choice","tag":"金利上昇と解約","q":"固定金利の貯蓄性商品で市場金利が大きく上昇した場合、一般に想定される契約者行動として最も適切なものはどれか。","c":["より高利回りの商品へ乗り換えるための解約が増える可能性がある。","解約率が必ずゼロになる。","死亡率が必ずゼロになる。","契約者貸付が制度上禁止される。"],"a":0,"e":"金利上昇はdynamic lapseを引き起こし得ます。","detail":"契約者は既契約の予定利率と市場の新しい利回りを比較します。市場金利が高くなると既契約の魅力が低下し、解約・乗換えが増える可能性があります。同時に債券価格が下落しているため、会社側には資産売却損riskも重なります。","tip":"『金利上昇→解約増→資産売却損』という連鎖は第2章の重要シナリオです。"},{"id":"c2q31","level":"exam","type":"keywords","tag":"金利上昇時の複合risk","q":"【列挙】市場金利上昇と解約増加が同時に起きた場合に会社が受ける主な影響を4つ挙げよ。","keys":[["債券価格下落","資産価格下落"],["解約増加"],["資産売却損","売却損"],["流動性","流動性リスク"]],"e":"正答例：債券価格下落、解約増加、資産売却損、流動性risk。","detail":"金利と解約を独立にstressすると、複合riskを過小評価します。金利上昇で資産価値が下がったときに解約が増えると、安値で資産を売却して現金を用意する必要が生じるため損失が拡大します。","tip":"第10章のscenario相関にもつながる重要な考え方です。"},{"id":"c2q32","level":"exam","type":"choice","tag":"解約率とanti-selection","q":"健康状態の良い契約者ほど解約し、高risk契約者が残りやすい場合に起こり得るものはどれか。","c":["残存群団のrisk濃縮","危険分散の自動拡大","予定利率の上昇","MVAの消滅"],"a":0,"e":"解約によるrisk濃縮が起こり得ます。","detail":"解約率は件数減少だけでなく、残った契約者集団の質を変える可能性があります。健康な契約者ほど乗換えやすい場合、残存群団の死亡・給付発生率が悪化し、予定基礎率へ影響することがあります。","tip":"『解約率×死亡・給付率の相関』まで説明できれば高得点です。"},{"id":"c2q33","level":"exam","type":"keywords","tag":"契約者保護","q":"【列挙】低・無解約返戻金型商品の募集時に契約者へ明確に説明すべき事項を4つ挙げよ。","keys":[["解約返戻金が低い","低解約返戻金"],["保険料が低い","保険料低廉"],["返戻率","経過年数別"],["長期継続","継続前提"]],"e":"正答例：返戻金が低い期間、保険料低廉化とのtrade-off、経過年数別返戻率、長期継続前提。","detail":"低解約返戻金型は保険料の安さが目立ちやすい一方、早期解約時の受取額が低いことを十分理解してもらう必要があります。契約者が『普通の終身保険と同じ返戻金がある』と誤認しないよう、具体例で説明します。","tip":"商品説明問題では『安い理由』と『途中解約の不利益』を対で書きます。"},{"id":"c2q34","level":"exam","type":"choice","tag":"社会的容認性","q":"解約返戻金を極端に低くする商品について、収益性以外に特に考慮すべきものはどれか。","c":["契約者保護・社会的容認性・公平性","広告の色だけ","標準生命表の作成年だけ","再保険会社の所在地だけ"],"a":0,"e":"契約者保護・社会的容認性・公平性が重要です。","detail":"理論上保険料を安くできても、解約時にほとんど何も戻らない商品が顧客ニーズに合っているか、説明可能か、社会的に受け入れられるかを考える必要があります。商品設計は数理的最適化だけでは完結しません。","tip":"『数理合理性＋社会的容認性』は生保1全体で使える論述軸です。"},{"id":"c2q35","level":"exam","type":"input","tag":"解約率設定プロセス","q":"予定解約率の設定では、自社の（①）を第一に分析し、必要に応じて他社・業界情報等を補完し、経過年数別の（②）と将来の（③）を検討する。","fields":[{"label":"①","answers":["経験値","実績"]},{"label":"②","answers":["解約率"]},{"label":"③","answers":["妥当性","トレンド","見通し"]}],"e":"完成例：経験値／解約率／妥当性（トレンド）。","detail":"解約率は商品・チャネル固有性が強いため、自社経験値が重要です。ただし新商品でデータが少ない場合には類似商品や外部情報を使います。単純平均ではなく経過年数別パターンと将来変化を確認します。","tip":"死亡率設定と同じく『データ→補完→将来トレンド→安全性』の流れで説明します。"},{"id":"c2q36","level":"exam","type":"choice","tag":"解約率の一律設定","q":"低解約返戻金型で全経過年数に同じ予定解約率を置くことの問題として最も適切なものはどれか。","c":["返戻金水準や払込満了等による契約者行動の変化を捉えられず、時点別収支を誤る可能性がある。","一律率の方が必ず精緻である。","解約率は商品設計と無関係である。","解約は収支に影響しない。"],"a":0,"e":"契約者行動は経過年数によって変わるため、一律率には限界があります。","detail":"初期は加入直後の見直し、中期は家計事情、払込満了前後は返戻金水準の変化など、解約理由が変わります。特にcliffがある商品では経過年数別の設定が必要です。","tip":"『経過年数別』は予定解約率の頻出キーワードです。"},{"id":"c2q37","level":"exam","type":"keywords","tag":"解約返戻金設計の観点","q":"【列挙】解約返戻金水準を設計するときの基本観点を6つ挙げよ。","keys":[["健全性"],["公平性"],["契約者保護"],["社会的容認性"],["収益性"],["商品性","価格競争力"]],"e":"正答例：健全性、公平性、契約者保護、社会的容認性、収益性、商品性・価格競争力。","detail":"返戻金を高くすれば契約者に有利に見えますが、新契約費回収や健全性に負担がかかります。低くすれば保険料を安くできますが、顧客保護や社会的容認性が問題になります。したがって複数目的を同時に調整します。","tip":"6語を答案の見出しとして使えるようにします。"},{"id":"c2q38","level":"exam","type":"choice","tag":"解約返戻金と価格競争力","q":"低解約返戻金型を採用する主な商品上の狙いとして最も適切なものはどれか。","c":["解約給付を抑える効果を利用して営業保険料を低廉化し、価格競争力を高めること。","死亡率をゼロにすること。","責任準備金を不要にすること。","事業費を完全になくすこと。"],"a":0,"e":"解約返戻金を抑えることで保険料低廉化につなげる設計です。","detail":"保障を長期継続する顧客にとって、途中解約給付を小さくして保険料を安くすることには合理性があります。一方で、解約する顧客との公平性や予定解約率riskを負うため、単純に『安いから良い』ではありません。","tip":"商品性とriskのtrade-offをセットで書きます。"},{"id":"c2q39","level":"exam","type":"input","tag":"MVAの資産価格","q":"MVAでは、市場金利が上昇すると固定利付の運用資産価格は一般に（①）し、その影響を解約返戻金に（②）する。","fields":[{"label":"①","answers":["低下","下落"]},{"label":"②","answers":["反映"]}],"e":"完成：低下（下落）／反映。","detail":"債券価格と金利は逆方向に動きます。MVAの本質はこの市場価値の変化を契約者価額へ反映することです。金利と資産価格の方向を取り違えると、数値問題も説明問題も失点します。","tip":"『金利↑→債券価格↓→返戻金↓』を反射的に答えられるようにします。"},{"id":"c2q40","level":"exam","type":"keywords","tag":"第2章・重要語総点検","q":"【列挙】第2章の重要キーワードを10個入力せよ。","keys":[["解約返戻金"],["解約控除"],["予定解約率"],["解約益"],["低解約返戻金","無解約返戻金"],["払済"],["転換"],["契約者貸付"],["MVA","市場価格調整"],["公平性","健全性"]],"e":"正答例：解約返戻金、解約控除、予定解約率、解約益、低・無解約返戻金型、払済、転換、契約者貸付、MVA、公平性・健全性。","detail":"第2章は『契約が途中で変化・消滅するとき、どの経済価値を誰に渡すか』を考える章です。解約返戻金の水準、予定解約率、制度間整合、MVA、契約者保護がすべてつながっています。","tip":"10語を見ずに書ければ、第2章の骨格はかなり固まっています。"},{"id":"c2q41","level":"hard","type":"keywords","tag":"総合・商品開発","q":"【難問・列挙】低解約返戻金型商品の新商品委員会で、アクチュアリーが確認すべき事項を8つ挙げよ。","keys":[["予定解約率"],["経過年数","cliff"],["解約益"],["新契約費"],["健全性","資本"],["公平性"],["契約者保護","説明"],["収益性","stress"]],"e":"正答例：予定解約率、経過年数別cliff、解約益、新契約費、健全性・資本、公平性、契約者保護・説明、収益stress。","detail":"低解約返戻金型は価格競争力を高められる一方、解約率前提への依存度が高まります。pricingだけでなく、販売後の契約者行動、資本、顧客説明まで一体で検証することが必要です。","tip":"列挙→各項目を1文で説明、までできると論述問題へそのまま転用できます。"},{"id":"c2q42","level":"hard","type":"choice","tag":"総合・MVAストレス","q":"一時払固定金利商品で金利が急上昇し、解約も急増した。MVAを導入していない場合に最も懸念される組合せはどれか。","c":["債券価格下落・資産売却損・流動性risk・残存者への負担","死亡率低下・事業費低下だけ","配当増加だけ","新契約費減少だけ"],"a":0,"e":"金利上昇と大量解約が重なると複合riskが顕在化します。","detail":"金利上昇で債券価格が下がっているところへ解約請求が集中すると、会社は含み損のある資産を売却して現金を準備します。MVAがなければ市場価値低下を解約者へ反映できず、残存契約者・会社資本へ損失が転嫁されます。","tip":"金利・解約・流動性・公平性の4方向を一つのscenarioで説明します。"},{"id":"c2q43","level":"hard","type":"keywords","tag":"MVA・記述答案骨格","q":"【難問・列挙】『MVAの概要、意義、解約時利率設定上の留意点』という記述問題に答えるための見出しを7つ挙げよ。","keys":[["市場金利"],["運用資産価格","資産価格"],["解約返戻金"],["資産売却損"],["公平性","流動性"],["残存期間","期間構造"],["タイムラグ","合理性","恣意性"]],"e":"正答例：市場金利、運用資産価格、解約返戻金、資産売却損、公平性・流動性、残存期間・期間構造、time lag・合理性。","detail":"2019年度のMVA記述を再現するための答案骨格です。まず概要として市場金利→資産価格→返戻金、次に意義として売却損・公平性・流動性、最後にi2設定として残存期間・time lag・合理性を書けば構造化できます。","tip":"見出しを暗記し、各見出しに2〜3文肉付けする練習が本番対策として有効です。"},{"id":"c2q44","level":"hard","type":"input","tag":"総合・制度間公平性","q":"無解約返戻金型で、解約者には0円、同時点の払済変更者には大きな価値を認めると、両者間の（①）が問題となり、契約者が払済へ（②）するincentiveが生じ得る。","fields":[{"label":"①","answers":["公平性"]},{"label":"②","answers":["集中","偏る","流れる"]}],"e":"完成：公平性／集中（偏る）。","detail":"解約・払済・転換は別制度でも、同一契約の経済価値を扱います。制度間で不自然な差をつけると、契約者は合理的に有利な制度へ移動し、想定していないcash flowが発生します。","tip":"『制度間公平性』と『契約者行動incentive』の2語を答案に入れます。"},{"id":"c2q45","level":"hard","type":"keywords","tag":"総合・解約率stress","q":"【難問・列挙】予定解約率を高く置いた商品で行うべきstress scenarioを5つ挙げよ。","keys":[["解約率下振れ"],["解約率上振れ"],["金利上昇","解約増"],["金利低下"],["cliff","払込満了"]],"e":"正答例：解約率下振れ、上振れ、金利上昇＋解約増、金利低下、払込満了時cliff。","detail":"解約率は単独で動くとは限りません。下振れでは解約益不足、上振れでは将来利益消失や流動性、金利上昇との複合では資産売却損が問題になります。商品固有の払込満了cliffも別scenarioで確認します。","tip":"『上下両方＋相関＋商品固有』の3種類を必ず入れます。"},{"id":"c2q46","level":"hard","type":"choice","tag":"総合・解約益","q":"会社が『解約益が出るので解約率は高いほど望ましい』と主張した。最も適切な反論はどれか。","c":["解約益だけでなく将来利益の消失、資産売却・流動性、anti-selection、顧客保護まで含める必要があり、高いほど望ましいとはいえない。","解約益は存在しない。","解約率は死亡率と同じなので考慮不要。","高い解約率は必ず健全性を高める。"],"a":0,"e":"解約率は単一の利益指標では評価できません。","detail":"解約率が高まると目先の解約益が増えることがあっても、将来の収益源が消え、残存群団のriskが濃縮し、資産売却や顧客満足度にも影響します。したがって商品全体の価値・riskで判断します。","tip":"生保1では『一要素だけで結論を出さない』姿勢が重要です。"},{"id":"c2q47","level":"hard","type":"keywords","tag":"総合monitoring","q":"【難問・列挙】第2章商品を販売後にmonitoringするダッシュボードへ入れたい指標を8つ挙げよ。","keys":[["実績解約率"],["予定解約率"],["解約返戻金"],["解約益"],["払済","転換"],["金利","市場金利"],["資産売却損","流動性"],["苦情","顧客"]],"e":"正答例：実績解約率、予定解約率、返戻金、解約益、払済・転換率、市場金利、資産売却損・流動性、苦情。","detail":"第2章では契約者行動と資産側が強く結び付きます。件数や解約率だけでなく、解約した場合の経済価値、他制度への移行、金利環境、顧客の声まで含めて監視します。","tip":"実務的な総合問題では『定量＋行動＋資産＋顧客』の4分類で考えると漏れにくいです。"},{"id":"c2q48","level":"hard","type":"choice","tag":"総合・MVAなし","q":"市場金利上昇時にMVAなしで解約返戻金を契約者価額のまま支払うことの公平性上の問題はどれか。","c":["資産価格下落による損失を解約者に反映できず、残存契約者や会社へ転嫁する可能性がある。","解約者が必ず損失を負担する。","残存契約者の負担は必ずゼロになる。","市場金利と公平性は無関係である。"],"a":0,"e":"MVAには契約者間の公平性を調整する意味があります。","detail":"市場価値が下がった資産を裏付けにしているのに、解約者へ帳簿価額的な契約者価額をそのまま支払えば、損失を残存者が引き受けます。MVAは解約時点の市場環境を反映し、この価値移転を抑えます。","tip":"『MVA＝金利risk管理』だけでなく『公平性』まで書くと答案が厚くなります。"},{"id":"c2q49","level":"hard","type":"input","tag":"総合・第2章の核心","q":"第2章は、契約が途中で消滅・変更するときの（①）を誰にどの程度帰属させるかを考える章であり、その判断では（②）と（③）の両立が重要である。","fields":[{"label":"①","answers":["経済価値","契約価値"]},{"label":"②","answers":["公平性"]},{"label":"③","answers":["健全性","契約者保護"]}],"e":"完成例：経済価値／公平性／健全性（契約者保護）。","detail":"解約返戻金、払済、転換、契約者貸付、MVAは一見別々の制度ですが、すべて契約の経済価値をどの時点で誰へ渡すかという共通テーマを持ちます。公平性を高めすぎて健全性を損なう、またはその逆にならないよう調整します。","tip":"章全体を一文で説明できると、個別論点の位置付けが理解しやすくなります。"},{"id":"c2q50","level":"hard","type":"keywords","tag":"最終総点検","q":"【最終・列挙】第2章を論述できる状態にするための重要語を12個入力せよ。","keys":[["解約返戻金"],["解約控除"],["新契約費"],["予定解約率"],["解約益"],["低解約返戻金","無解約返戻金"],["払済"],["転換"],["契約者貸付"],["MVA","市場価格調整"],["公平性"],["健全性","契約者保護"]],"e":"正答例：解約返戻金、解約控除、新契約費、予定解約率、解約益、低・無解約返戻金型、払済、転換、契約者貸付、MVA、公平性、健全性・契約者保護。","detail":"この12語は第2章の答案骨格です。個別制度を暗記するだけでなく、『費用回収』『契約者行動』『資産市場』『制度間公平性』『顧客保護』の5つの視点で結び付けると、過去問の表現が少し変わっても対応できます。","tip":"12語を白紙から書き、その後各語を1〜2文で説明する練習がおすすめです。"}]}};
const PASS="1582",AUTH_KEY="seiho1QuizAuthV1",LOGIN_DURATION=7*24*60*60*1000,STATE_KEY="seiho1IntegratedProgressV1";
const $=id=>document.getElementById(id),letters=["A","B","C","D"];
let state=loadState(),chapterId="1",bank=CHAPTERS["1"].bank,set=[],pos=0,answers={},checked={},revealed={};
function defaultState(){return{attempts:0,correct:0,weak:[],favorites:[]}}
function loadState(){try{return Object.assign(defaultState(),JSON.parse(localStorage.getItem(STATE_KEY)||"{}"))}catch(e){return defaultState()}}
function saveState(){localStorage.setItem(STATE_KEY,JSON.stringify(state));updateStats()}
function normalize(v){return String(v||"").normalize("NFKC").toLowerCase().replace(/[\s\u3000、,，・\/／。\.「」『』（）()\-ー]/g,"")}
function matchesAny(v,arr){const x=normalize(v);return arr.some(a=>{a=normalize(a);return x===a||(a.length>=2&&x.includes(a))})}
function isCorrect(q,a=answers[q.id]){if(q.type==="choice")return a===q.a;if(q.type==="input")return Array.isArray(a)&&q.fields.every((f,i)=>matchesAny(a[i],f.answers));if(q.type==="keywords")return typeof a==="string"&&q.keys.every(g=>matchesAny(a,g));return false}
function correctLabel(q){if(q.type==="choice")return `${letters[q.a]}：${q.c[q.a]}`;if(q.type==="input")return q.fields.map(f=>`${f.label} ${f.answers[0]}`).join(" ／ ");return q.keys.map(g=>g[0]).join("、")}
function showPanel(id){["homePanel","quizPanel","resultPanel"].forEach(x=>$(x).classList.toggle("show",x===id));window.scrollTo({top:0,behavior:"smooth"})}
function updateStats(){$("statAttempts").textContent=state.attempts;$("statCorrect").textContent=state.correct;$("statRate").textContent=state.attempts?Math.round(state.correct/state.attempts*100)+"%":"—";$("statWeak").textContent=state.weak.length}
function renderChapters(){const box=$("chapters");box.innerHTML="";Object.entries(CHAPTERS).forEach(([id,ch])=>{const b=document.createElement("button");b.className="chapter";b.innerHTML=`<span class="pill">${ch.bank.length}問</span><div class="chapter-no">CHAPTER ${id.padStart(2,"0")}</div><h4>${ch.short}</h4><p>${ch.desc}</p>`;b.onclick=()=>startChapter(id);box.appendChild(b)})}
function shuffled(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function buildSet(mode="all"){let candidates=bank;if(mode==="all"){const b=shuffled(bank.filter(q=>q.level==="basic")).slice(0,3),e=shuffled(bank.filter(q=>q.level==="exam")).slice(0,5),h=shuffled(bank.filter(q=>q.level==="hard")).slice(0,2);candidates=shuffled([...b,...e,...h])}else if(["basic","exam","hard"].includes(mode))candidates=bank.filter(q=>q.level===mode);else if(mode==="weak")candidates=bank.filter(q=>state.weak.includes(q.id));else if(mode==="favorite")candidates=bank.filter(q=>state.favorites.includes(q.id));if(!candidates.length){alert("対象問題がありません。全レベルに戻します。");$("mode").value="all";candidates=bank}set=shuffled(candidates).slice(0,10);pos=0;answers={};checked={};revealed={}}
function startChapter(id,mode="all"){chapterId=id;bank=CHAPTERS[id].bank;$("quizTitle").textContent=CHAPTERS[id].title;$("quizDesc").textContent=`${bank.length}問から毎回10問をランダム出題`;$("mode").value=mode;buildSet(mode);showPanel("quizPanel");renderQuestion()}
function renderQuestion(){const q=set[pos];$("qTag").textContent=`Q${pos+1} ・ ${{basic:"基礎",exam:"本番",hard:"難問"}[q.level]||""} ・ ${q.tag}`;$("question").textContent=q.q;$("choiceForm").innerHTML="";const disabled=checked[q.id]||revealed[q.id];
if(q.type==="choice"){q.c.forEach((t,i)=>{const lab=document.createElement("label");lab.className="choice";if(answers[q.id]===i)lab.classList.add("selected");if(checked[q.id]){if(i===q.a)lab.classList.add("correct");else if(answers[q.id]===i)lab.classList.add("wrong")}const inp=document.createElement("input");inp.type="radio";inp.name="a";inp.checked=answers[q.id]===i;inp.disabled=disabled;inp.onchange=()=>{answers[q.id]=i;renderQuestion()};const l=document.createElement("span");l.className="letter";l.textContent=letters[i];const s=document.createElement("span");s.textContent=t;lab.append(inp,l,s);$("choiceForm").append(lab)})}
else if(q.type==="input"){const box=document.createElement("div");box.className="input-answer";const vals=Array.isArray(answers[q.id])?answers[q.id]:q.fields.map(()=>"");q.fields.forEach((f,i)=>{const lab=document.createElement("label");lab.textContent=`空欄 ${f.label}`;const inp=document.createElement("input");inp.value=vals[i]||"";inp.disabled=disabled;inp.oninput=()=>{const v=[...vals];v[i]=inp.value;answers[q.id]=v};lab.append(inp);box.append(lab)});const hint=document.createElement("div");hint.className="input-hint";hint.textContent="軽微な表記ゆれは吸収します。";box.append(hint);$("choiceForm").append(box)}
else{const box=document.createElement("div");box.className="input-answer";const area=document.createElement("textarea");area.placeholder="順不同でキーワードを入力";area.value=typeof answers[q.id]==="string"?answers[q.id]:"";area.disabled=disabled;area.oninput=()=>answers[q.id]=area.value;box.append(area);const hint=document.createElement("div");hint.className="input-hint";hint.textContent=`必要なキーワード：${q.keys.length}個`;box.append(hint);$("choiceForm").append(box)}
const fav=state.favorites.includes(q.id);$("favoriteBtn").textContent=(fav?"★":"☆")+" お気に入り";
if(checked[q.id]||revealed[q.id]){$("feedback").className="feedback show";$("feedback").innerHTML=`<b>${revealed[q.id]&&!checked[q.id]?"答え・解説":isCorrect(q)?"正解！":"不正解"}　正解：${correctLabel(q)}</b><br><div style="margin-top:8px">${q.e}</div>${q.detail?`<div style="margin-top:14px;padding-top:12px;border-top:1px solid var(--line)"><b>詳しい解説</b><br>${q.detail}</div>`:""}${q.tip?`<div style="margin-top:12px;padding-top:12px;border-top:1px solid var(--line)"><b>試験での押さえ方</b><br>${q.tip}</div>`:""}<div class="muted" style="margin-top:10px;font-size:12px">${CHAPTERS[chapterId].source}</div>`}else{$("feedback").className="feedback";$("feedback").innerHTML=""}
const done=checked[q.id]||revealed[q.id];$("checkBtn").style.display=done?"none":"";$("revealBtn").style.display=done?"none":"";$("nextBtn").style.display=done?"":"none";$("nextBtn").textContent=pos===set.length-1?"結果を見る":"次へ →";$("prevBtn").disabled=pos===0;$("progressBar").style.width=((pos+1)/set.length*100)+"%";$("progressText").textContent=`${pos+1} / ${set.length}`;const cc=set.filter(x=>checked[x.id]).length,co=set.filter(x=>checked[x.id]&&isCorrect(x)).length;$("liveScore").textContent=`正解 ${co} / ${cc}`;$("questionNav").innerHTML="";set.forEach((x,i)=>{const b=document.createElement("button");b.textContent=i+1;if(i===pos)b.classList.add("current");if(checked[x.id])b.classList.add(isCorrect(x)?"correct":"wrong");b.onclick=()=>{pos=i;renderQuestion()};$("questionNav").append(b)})}
function judge(){const q=set[pos],a=answers[q.id],empty=a===undefined||(Array.isArray(a)&&a.every(v=>!String(v).trim()))||(typeof a==="string"&&!a.trim());if(empty){alert(q.type==="choice"?"選択肢を選んでください。":"回答を入力してください。");return}if(!checked[q.id]){checked[q.id]=true;state.attempts++;if(isCorrect(q)){state.correct++;state.weak=state.weak.filter(x=>x!==q.id)}else if(!state.weak.includes(q.id))state.weak.push(q.id);saveState()}renderQuestion()}
function finish(){const co=set.filter(q=>checked[q.id]&&isCorrect(q)).length,total=set.length;$("finalScore").textContent=`${co} / ${total}`;const r=co/total;$("grade").textContent=r>=.9?`${CHAPTERS[chapterId].title}：かなり強い`:r>=.7?"合格圏に近い":r>=.5?"もう一段":"重点復習推奨";$("resultMessage").textContent="間違えた論点は解説と教科書を結び付けて復習しましょう。";$("reviewList").innerHTML="";set.forEach(q=>{if(!checked[q.id]||!isCorrect(q)){const d=document.createElement("div");d.className="review";d.innerHTML=`<b>${q.tag}</b><br>正解：${correctLabel(q)}<br>${q.e}${q.detail?`<div style="margin-top:8px">${q.detail}</div>`:""}${q.tip?`<div class="muted" style="margin-top:8px"><b>試験での押さえ方：</b>${q.tip}</div>`:""}`;$("reviewList").append(d)}});showPanel("resultPanel")}
$("authForm").onsubmit=e=>{e.preventDefault();if($("pw").value===PASS){localStorage.setItem(AUTH_KEY,String(Date.now()+LOGIN_DURATION));$("auth").style.display="none";$("app").style.display="block"}else{$("authError").textContent="パスワードが違います。";$("pw").value=""}};
if(Number(localStorage.getItem(AUTH_KEY))>Date.now()){$("auth").style.display="none";$("app").style.display="block"}
$("homeBtn").onclick=()=>showPanel("homePanel");$("resultHomeBtn").onclick=()=>showPanel("homePanel");$("logoutBtn").onclick=()=>{localStorage.removeItem(AUTH_KEY);location.reload()};$("resetBtn").onclick=()=>{if(confirm("全章の学習記録をリセットしますか？")){state=defaultState();localStorage.removeItem(STATE_KEY);updateStats()}};$("newSetBtn").onclick=()=>startChapter(chapterId,$("mode").value);$("mode").onchange=()=>startChapter(chapterId,$("mode").value);$("checkBtn").onclick=judge;$("revealBtn").onclick=()=>{revealed[set[pos].id]=true;renderQuestion()};$("prevBtn").onclick=()=>{if(pos>0){pos--;renderQuestion()}};$("nextBtn").onclick=()=>{if(pos===set.length-1)finish();else{pos++;renderQuestion()}};$("favoriteBtn").onclick=()=>{const id=set[pos].id;state.favorites=state.favorites.includes(id)?state.favorites.filter(x=>x!==id):[...state.favorites,id];saveState();renderQuestion()};$("retryBtn").onclick=()=>startChapter(chapterId,"all");$("weakRetryBtn").onclick=()=>startChapter(chapterId,"weak");
renderChapters();updateStats();
